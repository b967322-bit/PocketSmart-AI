{% extends "base.html" %}{% block title %}Register{% endblock %}{% block content %}
<div class="auth-card"><h1>Create account</h1><form id="register-form">
<label>Full name<input name="full_name" required minlength="2"></label><label>Email<input type="email" name="email" required></label>
<label>Password<input type="password" name="password" required minlength="8"></label><button class="button" type="submit">Register</button>
<div id="form-message" class="message"></div></form><p>Already registered? <a href="/login">Login</a></p></div>
<script>document.getElementById("register-form").addEventListener("submit",async(e)=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));const r=await fetch("/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(r.ok)location.href="/login";else document.getElementById("form-message").textContent=d.detail||"Registration failed";});</script>
{% endblock %}
